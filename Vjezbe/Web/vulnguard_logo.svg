<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 768" width="1024" height="768">
  <!-- Background matches the gray canvas from the file for preview, but we make the logo standalone with a transparent background -->
  <rect width="100%" height="100%" fill="none"/>
  <g transform="translate(120, 260)">
    <!-- Custom stylized V -->
    <path d="M 0,0 L 45,130 L 110,0 L 90,0 L 45,95 L 15,0 Z" fill="#0e1c2f"/>
    <path d="M 50,40 L 75,115" stroke="#0e1c2f" stroke-width="8" stroke-linecap="round"/>
    
    <!-- Text 'uln' in Navy -->
    <text x="115" y="105" font-family="Arial, sans-serif" font-weight="900" font-size="125" fill="#0e1c2f" letter-spacing="-4">uln</text>
    
    <!-- Text 'Guard' in Teal -->
    <text x="315" y="105" font-family="Arial, sans-serif" font-weight="900" font-size="125" fill="#0b6e67" letter-spacing="-4">Guard</text>
  </g>
</svg>
